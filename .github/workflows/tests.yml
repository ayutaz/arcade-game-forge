name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.23'
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
  wasm:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ayutaz/scratch-arcade-os
          ref: 547e7ac7e1af8eedf1dc063f97a27a93425f50b7
          path: .cache/sdk
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.23'
      - run: uv sync --locked
      - run: uv run --locked python .cache/sdk/tools/bootstrap.py
      - run: uv run --locked python -m unittest discover -s tests/integration -v
        env:
          ARCADE_OS_ROOT: ${{ github.workspace }}/.cache/sdk
